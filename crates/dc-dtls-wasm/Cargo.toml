[package]
name = "dc-dtls-wasm"
version = "0.1.0"
edition = "2021"
description = "The dc-webrtc DTLS handshake + established core compiled to wasm32 for the JS stack: the DtlsConnection surface for the JS stack, Rust core inside"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
dc-webrtc = { path = "../../webrtc/rust" }
wasm-bindgen = "=0.2.100"
js-sys = "0.3"

[profile.release]
opt-level = "s"
