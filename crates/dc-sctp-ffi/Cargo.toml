[package]
name = "dc-sctp-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI over the dc-webrtc SCTP association: the shared Rust transport core for generated runtimes in other languages"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dc-webrtc = { path = "../../webrtc/rust" }

[dev-dependencies]
serde_json = "1"
