[package]
name = "dc-sctp-wasm"
version = "0.1.0"
edition = "2021"
description = "The dc-webrtc SCTP association compiled to wasm32 for the JS stack: same Association surface as webrtc/js/sctp.js, Rust core inside"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
dc-webrtc = { path = "../../webrtc/rust" }
wasm-bindgen = "=0.2.100"
js-sys = "0.3"

[profile.release]
opt-level = "s"
