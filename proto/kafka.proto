// Kafka over gRPC: a Kafka/Redpanda facade served by the
// Rust kafka proxy. This file is the public wire contract;
// stubs are generated into every language by the grpc-dc
// protoc plugins (see the kafka-stubs Makefile target).
//
// The proxy terminates these RPCs and speaks the Kafka
// binary protocol to Apache Kafka (KRaft) or Redpanda.
// Kafka error codes pass through in the *_code fields;
// transport-level failures use the gRPC status.

syntax = "proto3";

package grpcdc.kafka.v1;

enum Compression {
  COMPRESSION_NONE = 0;
  COMPRESSION_GZIP = 1;
  COMPRESSION_SNAPPY = 2;
  COMPRESSION_LZ4 = 3;
  COMPRESSION_ZSTD = 4;
}

enum Acks {
  ACKS_UNSPECIFIED = 0; // proxy default: ACKS_ALL
  ACKS_NONE = 1;
  ACKS_LEADER = 2;
  ACKS_ALL = 3;
}

message Header {
  string key = 1;
  bytes value = 2;
}

message Record {
  bytes key = 1;
  bytes value = 2;
  repeated Header headers = 3;
  int64 timestamp_ms = 4; // 0 = broker/log-append time
  bool null_key = 5; // true = Kafka null key (distinct from empty)
}

message FetchedRecord {
  int64 offset = 1;
  int64 timestamp_ms = 2;
  bytes key = 3;
  bytes value = 4;
  repeated Header headers = 5;
  bool key_null = 6; // true when the Kafka record key was null
}

message TopicPartition {
  string topic = 1;
  int32 partition = 2;
}

// --- Metadata -------------------------------------------------

message MetadataRequest {
  repeated string topics = 1; // empty = all topics
  bool allow_auto_topic_creation = 2;
}

message BrokerMetadata {
  int32 node_id = 1;
  string host = 2;
  int32 port = 3;
  string rack = 4;
}

message PartitionMetadata {
  int32 id = 1;
  int32 leader_id = 2;
  int32 leader_epoch = 3;
  repeated int32 replicas = 4;
  repeated int32 isr = 5;
  int32 error_code = 6;
}

message TopicMetadata {
  string name = 1;
  bool is_internal = 2;
  int32 error_code = 3;
  repeated PartitionMetadata partitions = 4;
}

message MetadataResponse {
  int32 throttle_time_ms = 1;
  repeated BrokerMetadata brokers = 2;
  string cluster_id = 3;
  int32 controller_id = 4;
  repeated TopicMetadata topics = 5;
}

// --- Producer sessions (idempotence / transactions) -----------

message OpenProducerRequest {
  string transactional_id = 1; // empty = idempotent-only producer
  int32 transaction_timeout_ms = 2;
}

message OpenProducerResponse {
  string session_id = 1; // proxy-issued; pass to Produce/EndTransaction
  int64 producer_id = 2;
  int32 producer_epoch = 3;
  int32 error_code = 4;
}

message CloseProducerRequest {
  string session_id = 1;
}

message CloseProducerResponse {
  int32 error_code = 1;
}

message EndTransactionRequest {
  string session_id = 1;
  bool commit = 2;
}

message EndTransactionResponse {
  int32 error_code = 1;
}

// --- Produce ----------------------------------------------------

message ProduceRequest {
  string topic = 1;
  int32 partition = 2; // -1 = broker/partitioner choice (proxy round-robin)
  repeated Record records = 3;
  Acks acks = 4;
  int32 timeout_ms = 5;
  Compression compression = 6;
  string session_id = 7; // optional; from OpenProducer (idempotent/txn)
  string transactional_id = 8; // informational; proxy resolves via session
}

message ProduceResponse {
  int32 partition = 1;
  int64 base_offset = 2;
  int64 log_append_time_ms = 3;
  int32 error_code = 4;
}

// --- Consume (assignment mode) ----------------------------------

message ConsumeRequest {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3; // -2 = earliest, -1 = latest, else absolute
  int32 max_records = 4; // per response chunk; 0 = proxy default
  int32 max_wait_ms = 5; // long-poll budget per chunk
  int32 min_bytes = 6;
  bool read_committed = 7; // only committed transactional records
}

message ConsumeResponse {
  string topic = 1;
  int32 partition = 2;
  int64 high_watermark = 3;
  int32 error_code = 4;
  repeated FetchedRecord records = 5;
}

// --- Consumer groups --------------------------------------------

message GroupSubscribeRequest {
  string group_id = 1;
  repeated string topics = 2;
  string group_instance_id = 3; // optional static membership
  int32 session_timeout_ms = 4;
  int32 max_poll_records = 5;
  string auto_offset_reset = 6; // "earliest" | "latest"
  bool read_committed = 7; // only committed transactional records
  // Group protocol: "" (auto: KIP-848 when the broker offers
  // it, classic otherwise), "consumer" (require KIP-848), or
  // "classic" (require JoinGroup/SyncGroup).
  string group_protocol = 8;
}

message GroupSubscribeResponse {
  oneof event {
    Assignment assignment = 1;
    RecordBatch batch = 2;
    GroupError group_error = 3;
  }
}

message Assignment {
  int32 generation_id = 1;
  string member_id = 2;
  repeated TopicPartition partitions = 3;
}

message RecordBatch {
  string topic = 1;
  int32 partition = 2;
  int64 high_watermark = 3;
  repeated FetchedRecord records = 4;
}

message GroupError {
  int32 error_code = 1;
  string message = 2;
}

// --- Offsets ------------------------------------------------------

message ListOffsetsRequest {
  string topic = 1;
  int32 partition = 2;
  int64 timestamp = 3; // -2 = earliest, -1 = latest, else ms since epoch
  bool read_committed = 4; // latest = last stable offset
}

message ListOffsetsResponse {
  int64 offset = 1;
  int64 timestamp_ms = 2;
  int32 error_code = 3;
}

message CommitOffsetRequest {
  string group_id = 1;
  string topic = 2;
  int32 partition = 3;
  int64 committed_offset = 4; // next offset to consume
  string metadata = 5;
  string session_id = 6; // from OpenProducer; commit inside that transaction
}

message CommitOffsetResponse {
  int32 error_code = 1;
}

message FetchOffsetRequest {
  string group_id = 1;
  string topic = 2;
  int32 partition = 3;
}

message FetchOffsetResponse {
  int64 committed_offset = 1; // -1 = none committed
  string metadata = 2;
  int32 error_code = 3;
}

// --- Admin --------------------------------------------------------

message NewTopic {
  string name = 1;
  int32 num_partitions = 2; // -1 = broker default
  int32 replication_factor = 3; // -1 = broker default
}

message CreateTopicsRequest {
  repeated NewTopic topics = 1;
  int32 timeout_ms = 2;
  bool validate_only = 3;
}

message TopicError {
  string name = 1;
  int32 error_code = 2;
}

message CreateTopicsResponse {
  repeated TopicError results = 1;
}

message DeleteTopicsRequest {
  repeated string topics = 1;
  int32 timeout_ms = 2;
}

message DeleteTopicsResponse {
  repeated TopicError results = 1;
}

// --- Admin: configuration --------------------------------------

enum ConfigResourceType {
  CONFIG_RESOURCE_UNKNOWN = 0;
  CONFIG_RESOURCE_TOPIC = 2;
  CONFIG_RESOURCE_BROKER = 4;
  CONFIG_RESOURCE_BROKER_LOGGER = 8;
  CONFIG_RESOURCE_CLIENT_METRICS = 16;
  CONFIG_RESOURCE_GROUP = 32;
}

message ConfigEntry {
  string name = 1;
  string value = 2; // empty with op DELETE deletes the key
}

enum ConfigOp {
  CONFIG_OP_SET = 0;
  CONFIG_OP_DELETE = 1;
}

message AlterConfigEntry {
  string name = 1;
  string value = 2;
  ConfigOp op = 3;
}

message DescribeConfigsRequest {
  ConfigResourceType resource_type = 1;
  string resource_name = 2; // broker: node id as string, "" = default
  repeated string config_keys = 3; // empty = all keys
  bool include_synonyms = 4;
}

message ConfigValue {
  string name = 1;
  string value = 2;
  bool read_only = 3;
  int32 source = 4; // Kafka ConfigSource code
  bool is_sensitive = 5;
}

message DescribeConfigsResponse {
  int32 error_code = 1;
  repeated ConfigValue values = 2;
}

message AlterConfigsRequest {
  ConfigResourceType resource_type = 1;
  string resource_name = 2;
  repeated AlterConfigEntry entries = 3;
  bool validate_only = 4;
}

message AlterConfigsResponse {
  int32 error_code = 1;
}

// --- Admin: partitions / records --------------------------------

message CreatePartitionsRequest {
  string topic = 1;
  int32 total_count = 2;
  bool validate_only = 3;
  int32 timeout_ms = 4;
}

message CreatePartitionsResponse {
  int32 error_code = 1;
}

message DeleteRecordsRequest {
  string topic = 1;
  int32 partition = 2;
  int64 before_offset = 3; // -1 = up to the high watermark
}

message DeleteRecordsResponse {
  int64 low_watermark = 1;
  int32 error_code = 2;
}

// --- Admin: groups ----------------------------------------------

message ListGroupsRequest {}

message GroupListing {
  string group_id = 1;
  string protocol_type = 2;
  string group_state = 3;
}

message ListGroupsResponse {
  int32 error_code = 1;
  repeated GroupListing groups = 2;
}

message DescribeGroupsRequest {
  repeated string group_ids = 1;
}

message GroupMember {
  string member_id = 1;
  string client_id = 2;
  string client_host = 3;
  repeated TopicPartition assignment = 4;
}

message DescribedGroup {
  string group_id = 1;
  int32 error_code = 2;
  string group_state = 3;
  string protocol_type = 4;
  string protocol = 5;
  repeated GroupMember members = 6;
}

message DescribeGroupsResponse {
  repeated DescribedGroup groups = 1;
}

message DeleteGroupsRequest {
  repeated string group_ids = 1;
}

message GroupErrorResult {
  string group_id = 1;
  int32 error_code = 2;
}

message DeleteGroupsResponse {
  repeated GroupErrorResult results = 1;
}

message DeleteGroupOffsetsRequest {
  string group_id = 1;
  string topic = 2;
  repeated int32 partitions = 3;
}

message DeleteGroupOffsetsResponse {
  int32 error_code = 1;
}

// --- Admin: ACLs --------------------------------------------------

message Acl {
  int32 resource_type = 1; // Kafka ResourceType code
  string resource_name = 2;
  int32 pattern_type = 3; // Kafka ResourcePatternType code
  string principal = 4; // e.g. "User:alice"; "" = any (describe)
  string host = 5; // "" or "*" = any (describe)
  int32 operation = 6; // Kafka AclOperation code
  int32 permission_type = 7; // Kafka AclPermissionType: 0 UNKNOWN, 1 ANY, 2 DENY, 3 ALLOW
}

message DescribeAclsRequest {
  Acl filter = 1; // Kafka match semantics; empty fields match any
}

message DescribeAclsResponse {
  int32 error_code = 1;
  repeated Acl acls = 2;
}

message CreateAclsRequest {
  repeated Acl acls = 1;
}

message CreateAclsResponse {
  repeated int32 error_codes = 1; // aligned with the request list
}

message DeleteAclsRequest {
  repeated Acl filters = 1; // each filter deletes its matches
}

message DeleteAclsResponse {
  repeated int32 error_codes = 1; // aligned with the filter list
}

// --- Admin: transactions ------------------------------------------

message ListTransactionsRequest {}

message TransactionListing {
  string transactional_id = 1;
  int64 producer_id = 2;
  string transaction_state = 3; // Kafka state name, e.g. "Ongoing"
}

message ListTransactionsResponse {
  int32 error_code = 1;
  repeated TransactionListing transactions = 2;
}

message DescribeTransactionsRequest {
  repeated string transactional_ids = 1;
}

message DescribedTransaction {
  string transactional_id = 1;
  int32 error_code = 2;
  int64 producer_id = 3;
  int32 producer_epoch = 4;
  string transaction_state = 5; // Kafka state name, e.g. "Ongoing"
  int64 last_update_timestamp_ms = 6;
}

message DescribeTransactionsResponse {
  repeated DescribedTransaction transactions = 1;
}

// --- Service ------------------------------------------------------


// --- Share groups (KIP-932) ----------------------------------

message OpenShareGroupRequest {
  string group_id = 1;
  repeated string topics = 2;
  string group_instance_id = 3; // optional static membership
  int32 session_timeout_ms = 4;
}

message OpenShareGroupResponse {
  string session_id = 1;
  int32 error_code = 2;
  Assignment assignment = 3;
}

message SharePollRequest {
  string session_id = 1;
  int32 max_records = 2;
  int32 max_wait_ms = 3;
}

message SharePollRecord {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  bytes key = 4;
  bytes value = 5;
  repeated Header headers = 6;
  int64 timestamp_ms = 7;
  int32 delivery_count = 8; // 1 = first delivery
  bool null_key = 9;
}

message SharePollResponse {
  repeated SharePollRecord records = 1;
  int32 error_code = 2;
}

message ShareAckEntry {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  // 1 = ACCEPT (done), 2 = RELEASE (redeliver soon),
  // 3 = REJECT (redeliver later / dead-letter path).
  int32 ack_type = 4;
}

message ShareAckRequest {
  string session_id = 1;
  repeated ShareAckEntry entries = 2;
}

message ShareAckResponse {
  int32 error_code = 1;
}

message CloseShareGroupRequest {
  string session_id = 1;
}

message CloseShareGroupResponse {
  int32 error_code = 1;
}

message ShareGroupMember {
  string member_id = 1;
  int32 member_epoch = 2;
  string client_id = 3;
  string client_host = 4;
  repeated string subscribed_topics = 5;
  repeated TopicPartition assignment = 6;
}

message ShareGroupDescription {
  string group_id = 1;
  int32 error_code = 2;
  string state = 3;
  int32 group_epoch = 4;
  int32 assignment_epoch = 5;
  repeated ShareGroupMember members = 6;
}

message DescribeShareGroupsRequest {
  repeated string group_ids = 1;
}

message DescribeShareGroupsResponse {
  repeated ShareGroupDescription groups = 1;
  int32 error_code = 2;
}

service Kafka {
  rpc Metadata(MetadataRequest) returns (MetadataResponse);
  rpc OpenProducer(OpenProducerRequest) returns (OpenProducerResponse);
  rpc CloseProducer(CloseProducerRequest) returns (CloseProducerResponse);
  rpc EndTransaction(EndTransactionRequest) returns (EndTransactionResponse);
  rpc Produce(ProduceRequest) returns (ProduceResponse);
  rpc Consume(ConsumeRequest) returns (stream ConsumeResponse);
  rpc Subscribe(GroupSubscribeRequest) returns (stream GroupSubscribeResponse);
  rpc ListOffsets(ListOffsetsRequest) returns (ListOffsetsResponse);
  rpc CommitOffset(CommitOffsetRequest) returns (CommitOffsetResponse);
  rpc FetchOffset(FetchOffsetRequest) returns (FetchOffsetResponse);
  rpc CreateTopics(CreateTopicsRequest) returns (CreateTopicsResponse);
  rpc DeleteTopics(DeleteTopicsRequest) returns (DeleteTopicsResponse);
  rpc DescribeConfigs(DescribeConfigsRequest) returns (DescribeConfigsResponse);
  rpc AlterConfigs(AlterConfigsRequest) returns (AlterConfigsResponse);
  rpc CreatePartitions(CreatePartitionsRequest) returns (CreatePartitionsResponse);
  rpc DeleteRecords(DeleteRecordsRequest) returns (DeleteRecordsResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc DescribeGroups(DescribeGroupsRequest) returns (DescribeGroupsResponse);
  rpc DeleteGroups(DeleteGroupsRequest) returns (DeleteGroupsResponse);
  rpc DeleteGroupOffsets(DeleteGroupOffsetsRequest) returns (DeleteGroupOffsetsResponse);
  rpc DescribeAcls(DescribeAclsRequest) returns (DescribeAclsResponse);
  rpc CreateAcls(CreateAclsRequest) returns (CreateAclsResponse);
  rpc DeleteAcls(DeleteAclsRequest) returns (DeleteAclsResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc DescribeTransactions(DescribeTransactionsRequest) returns (DescribeTransactionsResponse);
  // KIP-932 share groups (queue consume): session-based like
  // producer sessions, since acknowledgements must flow back
  // from the client — something a server-stream cannot carry.
  rpc OpenShareGroup(OpenShareGroupRequest) returns (OpenShareGroupResponse);
  rpc SharePoll(SharePollRequest) returns (SharePollResponse);
  rpc ShareAck(ShareAckRequest) returns (ShareAckResponse);
  rpc CloseShareGroup(CloseShareGroupRequest) returns (CloseShareGroupResponse);
  rpc DescribeShareGroups(DescribeShareGroupsRequest) returns (DescribeShareGroupsResponse);
}
