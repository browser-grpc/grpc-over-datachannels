<!doctype html>
<meta charset="utf-8">
<title>grpc-dc WASM Zig stream server test</title>
<script type="module">
import { Channel, createGrpcDcServerBridge } from "/js/index.js";

// Incremental server role for the Zig/WASM facade: requests are
// fed one at a time to the generated serve_*Start/Feed/End
// exports through registerClientStreamInc/registerBidiInc, so a
// bidi response can leave before the next request arrives.
const pc = new RTCPeerConnection();
window.__pc = pc;
const dc = pc.createDataChannel("grpc");
window.__dc = dc;

window.__acceptAnswer = async (sdp) => {
  await pc.setRemoteDescription({ type: "answer", sdp });
};

window.__runServer = async () => {
  if (dc.readyState !== "open") {
    await new Promise((resolve) => dc.addEventListener("open", resolve, { once: true }));
  }
  const bridge = createGrpcDcServerBridge(new Channel(dc));
  let instance;
  const mem = () => new Uint8Array(instance.exports.memory.buffer);
  const pending = new Map();
  let nextId = 1;
  const pack = (list) => {
    let total = 0;
    for (const item of list) total += 4 + item.length;
    const out = new Uint8Array(total);
    const dv = new DataView(out.buffer);
    let pos = 0;
    for (const item of list) {
      dv.setUint32(pos, item.length);
      pos += 4;
      out.set(item, pos);
      pos += item.length;
    }
    return out;
  };
  const writeArg = (bytes) => {
    const ptr = bytes.length ? instance.exports.wasm_alloc(bytes.length) : 0;
    if (bytes.length) mem().set(bytes, ptr);
    return ptr;
  };
  const drive = async (prefix, source, mdPairs, onMessage) => {
    const id = nextId++;
    const settled = new Promise((resolve, reject) =>
      pending.set(id, { resolve, reject, messages: [], onMessage }));
    const packedMd = pack(mdPairs.map((s) => new TextEncoder().encode(s)));
    const mdPtr = writeArg(packedMd);
    instance.exports[prefix + "Start"](id, mdPtr, packedMd.length);
    instance.exports.wasm_free(mdPtr, packedMd.length);
    try {
      while (true) {
        const payload = await source.next();
        if (payload === null) break;
        const ptr = writeArg(payload);
        instance.exports[prefix + "Feed"](id, ptr, payload.length);
        instance.exports.wasm_free(ptr, payload.length);
      }
      instance.exports[prefix + "End"](id);
    } catch (err) {
      pending.delete(id);
      throw err;
    }
    return settled;
  };
  const env = {
    js_now_ms: () => performance.now(),
    js_server_respond(id, ptr, len) {
      const entry = pending.get(id);
      pending.delete(id);
      if (entry) entry.resolve({ response: mem().slice(ptr, ptr + len), messages: entry.messages });
    },
    js_server_send(id, ptr, len) {
      const entry = pending.get(id);
      if (entry) {
        const bytes = mem().slice(ptr, ptr + len);
        entry.messages.push(bytes);
        if (entry.onMessage) entry.onMessage(bytes);
      }
    },
    js_server_complete(id) {
      const entry = pending.get(id);
      pending.delete(id);
      if (entry) entry.resolve({ response: null, messages: entry.messages });
    },
    js_server_fail(id, code, ptr, len) {
      const entry = pending.get(id);
      pending.delete(id);
      if (entry) {
        const err = new Error(new TextDecoder().decode(mem().subarray(ptr, ptr + len)));
        err.code = code;
        entry.reject(err);
      }
    },
  };
  const bytes = await (await fetch("/browser-test/echo_zig_stream_server.wasm")).arrayBuffer();
  ({ instance } = await WebAssembly.instantiate(bytes, { env }));
  instance.exports.run_echo_stream_server();
  bridge.registerClientStreamInc("/echo.Echo/ClientStream", async (source, mdPairs) =>
    (await drive("serve_clientStream", source, mdPairs, null)).response);
  bridge.registerBidiInc("/echo.Echo/Bidi", async (source, mdPairs, onMessage) => {
    await drive("serve_bidi", source, mdPairs, onMessage);
  });
  bridge.start("echo.Echo");
};

const offer = await pc.createOffer();
await pc.setLocalDescription(offer);
await new Promise((resolve) => {
  if (pc.iceGatheringState === "complete") resolve();
  else pc.addEventListener("icegatheringstatechange", () => {
    if (pc.iceGatheringState === "complete") resolve();
  });
});
window.__offer = pc.localDescription.sdp;
</script>
