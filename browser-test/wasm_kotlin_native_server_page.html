<!doctype html>
<meta charset="utf-8">
<title>grpc-dc WASM native Kotlin server test</title>
<script type="module">
import { DcChunkReassembler, splitDcMessage } from "/js/index.js";
// Native-runtime test: the real generated Zig client +
// grpcdc runtime run in a Web Worker (WASM), driving the
// browser's native RTCDataChannel through a SharedArrayBuffer
// mailbox. Requires cross-origin isolation (the test server
// sends COOP/COEP headers).
const pc = new RTCPeerConnection();
window.__pc = pc;
const dc = pc.createDataChannel("grpc");
dc.binaryType = "arraybuffer";
window.__dc = dc;

window.__acceptAnswer = async (sdp) => {
  await pc.setRemoteDescription({ type: "answer", sdp });
};

const SAB_DATA = 4 * 1024 * 1024; // fits a 1 MiB frame + margin (large-message legs)
window.__runServer = async () => {
  if (dc.readyState !== "open") {
    await new Promise((resolve) => dc.addEventListener("open", resolve, { once: true }));
  }
  const sab = new SharedArrayBuffer(8 + SAB_DATA);
  const i32 = new Int32Array(sab);
  const sabBytes = new Uint8Array(sab);
  const queue = [];
  let pumpTimer = null;
  const pumpQueue = () => {
    pumpTimer = null;
    if (queue.length && Atomics.load(i32, 0) === 0) {
      const bytes = queue.shift();
      sabBytes.set(bytes.subarray(0, SAB_DATA), 8);
      i32[1] = Math.min(bytes.length, SAB_DATA);
      Atomics.store(i32, 0, 1);
      Atomics.notify(i32, 0);
    }
    if (queue.length) pumpTimer = setTimeout(pumpQueue, 1);
  };
  // DC chunk shim: >64 KiB frames arrive as chunks and are
  // reassembled before the mailbox (browser 256 KiB cap).
  const reassembler = new DcChunkReassembler();
  dc.addEventListener("message", (event) => {
    const whole = reassembler.push(new Uint8Array(event.data));
    if (whole === null) return;
    queue.push(whole);
    if (!pumpTimer) pumpQueue();
  });
  dc.addEventListener("close", () => {
    Atomics.store(i32, 0, 2);
    Atomics.notify(i32, 0);
  });

  const worker = new Worker("/browser-test/wasm_kotlin_native_worker.js", { type: "module" });
  worker.addEventListener("message", (event) => {
    if (event.data.t === "send" && dc.readyState === "open") for (const chunk of splitDcMessage(event.data.bytes)) dc.send(chunk);
    // Tracing mode reports cumulative spans as results.
    if (event.data.t === "result") window.__spans = JSON.parse(event.data.json);
  });
  const ready = new Promise((resolve, reject) => {
    worker.addEventListener("message", (event) => {
      const msg = event.data;
      if (msg.t === "ready") resolve();
      else if (msg.t === "error") reject(new Error(msg.message));
    });
    worker.onerror = (err) => reject(err);
  });
  worker.postMessage({ sab, wasmUrl: "/browser-test/kotlin_wasm_native_gen/echo_kotlin_native.mjs", mode: window.__kotlinServerMode || "server" });
  window.__worker = worker;
  await ready;
};

// Matrix tracing entry: server spans land on window.__spans.
window.__spans = { starts: [], ends: [] };
window.__runServerTracing = async () => {
  window.__kotlinServerMode = "server-tracing";
  return window.__runServer();
};

const offer = await pc.createOffer();
await pc.setLocalDescription(offer);
await new Promise((resolve) => {
  if (pc.iceGatheringState === "complete") resolve();
  else pc.addEventListener("icegatheringstatechange", () => {
    if (pc.iceGatheringState === "complete") resolve();
  });
});
window.__offer = pc.localDescription.sdp;
</script>
