<!doctype html>
<meta charset="utf-8">
<title>grpc-dc browser BDD test</title>
<script type="module">
import { Channel } from "/js/index.js";
import { EchoRequest, EchoResponse } from "/js/examples/echo_pb.js";
import { EchoClient } from "/js/examples/echo_grpc_dc.js";
import { BDD_SCENARIOS } from "/browser-test/bdd_scenarios.generated.mjs";
import { runBddScenarios } from "/browser-test/bdd_runner.mjs";

// Browser side: native RTCPeerConnection, grpc-dc JS client over
// the "grpc" RTCDataChannel, executing the full generated BDD
// scenario table. Signaling mirrors grpc_page.html: the Node test
// reads window.__offer, then calls window.__acceptAnswer(sdp).
const pc = new RTCPeerConnection();
window.__pc = pc;
const dc = pc.createDataChannel("grpc");
window.__dc = dc;

window.__runBdd = async () => {
  if (dc.readyState !== "open") {
    await new Promise((resolve) => dc.addEventListener("open", resolve, { once: true }));
  }
  const channel = new Channel(dc);
  const client = new EchoClient(channel);
  return runBddScenarios({
    client,
    channel,
    EchoRequest,
    EchoResponse,
    scenarios: BDD_SCENARIOS,
  });
};

window.__acceptAnswer = async (sdp) => {
  await pc.setRemoteDescription({ type: "answer", sdp });
};

const offer = await pc.createOffer();
await pc.setLocalDescription(offer);
await new Promise((resolve) => {
  if (pc.iceGatheringState === "complete") resolve();
  else pc.addEventListener("icegatheringstatechange", () => {
    if (pc.iceGatheringState === "complete") resolve();
  });
});
window.__offer = pc.localDescription.sdp;
</script>
