<!doctype html>
<meta charset="utf-8">
<title>grpc-dc browser TURN client test</title>
<script type="module">
// Browser side: native RTCPeerConnection configured with a TURN
// server (the repo's fake, ?turn=host:port), answering the JS
// stack's offer. The browser allocates a relay candidate from the
// fake; the JS stack does the same; the echo channel's traffic is
// relayed through the two allocations. The JS stack advertises an
// unreachable host address, so only the relayed pair can connect.
const turn = new URLSearchParams(location.search).get("turn");
const pc = new RTCPeerConnection({
  iceServers: [{ urls: `turn:${turn}`, username: "dcuser", credential: "dcpass" }],
});
window.__pc = pc;
pc.addEventListener("datachannel", (event) => {
  const channel = event.channel;
  channel.binaryType = "arraybuffer";
  channel.addEventListener("message", (e) => channel.send(e.data));
});

window.__acceptOffer = async (sdp) => {
  await pc.setRemoteDescription({ type: "offer", sdp });
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") resolve();
    else pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") resolve();
    });
  });
  window.__answer = pc.localDescription.sdp;
};
</script>
