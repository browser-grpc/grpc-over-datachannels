[package]
name = "grpc-dc"
version = "0.38.0"
edition = "2021"
license = "Apache-2.0"
description = "gRPC over WebRTC DataChannels: dependency-free generated Rust runtime, client and server, all four call shapes, over a single RTCDataChannel."
homepage = "https://github.com/browser-grpc/grpc-over-datachannels"
repository = "https://github.com/browser-grpc/grpc-over-datachannels"
readme = "README.md"
keywords = ["grpc", "webrtc", "datachannel", "rpc"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "grpc_dc"
path = "src/lib.rs"

[features]
default = []
prost = ["dep:prost"]
kafka-tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-channel = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
prost = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
