[package]
name = "dc-webrtc"
version = "0.1.0"
edition = "2021"
description = "Browser-grade WebRTC datachannel stack (ICE/DTLS/SCTP/DCEP) with zero external dependencies; protocol tables generated by a Racket metaprogram"
license = "Apache-2.0"

# Zero external dependencies is a hard requirement (SPEC-WEBRTC.md):
# std threads + blocking sockets + hand-rolled crypto only.
[features]
default = ["std"]
# std: OS sockets/threads/clocks (Peer, endpoint, TURN, mDNS,
# std transports). Disable for the alloc-only bare-metal core
# (ICE/DTLS/SCTP/DCEP/SDP/STUN/net/platform traits).
std = []

[dependencies]
