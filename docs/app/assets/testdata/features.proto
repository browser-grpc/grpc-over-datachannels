syntax = "proto3";

package feat.v1;

// Descriptor-feature coverage for the generated message types:
// three levels of nesting, a nested enum, a oneof, reserved
// ranges/names, an enum-valued map, and packed fixed fields.

enum Shade {
  SHADE_UNSPECIFIED = 0;
  LIGHT = 1;
  DARK = 2;
}

message Outer {
  message Middle {
    message Inner {
      string v = 1;
      int32 n = 2;
    }

    enum Kind {
      KIND_UNSPECIFIED = 0;
      ALPHA = 1;
      BETA = 2;
    }

    Inner inner = 1;
    Kind kind = 2;
  }

  reserved 100 to 110;
  reserved "old_field", "older";

  Middle middle = 1;

  oneof choice {
    string text = 2;
    int32 code = 3;
    Middle picked = 4;
  }

  map<string, Shade> shades = 5;
  repeated fixed32 fixeds = 6;
  Shade shade = 7;
}
