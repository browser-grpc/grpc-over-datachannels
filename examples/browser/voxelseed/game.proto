syntax = "proto3";

// Multiplayer voxel demo: the session host's browser runs the
// Game service; guests call it over a grpc-dc DataChannel.
package demo.game;

message JoinRequest {
  string name = 1;
}

message JoinResponse {
  int32 player_id = 1;
  int32 seed = 2; // terrain seed; edits below override it
  repeated BlockEdit edits = 3;
}

message BlockEdit {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  int32 block = 4; // 0 = air (remove)
}

message Pos {
  float x = 1;
  float y = 2;
  float z = 3;
  float yaw = 4;
}

message ClientMsg {
  int32 player_id = 3; // id from JoinResponse; binds stream to player
  oneof kind {
    Pos pos = 1;
    BlockEdit edit = 2;
  }
}

message PlayerState {
  int32 id = 1;
  string name = 2;
  Pos pos = 3;
}

message ServerMsg {
  oneof kind {
    PlayerState player = 1;
    BlockEdit edit = 2;
    int32 left = 3; // player id that left
  }
}

service Game {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Play(stream ClientMsg) returns (stream ServerMsg);
}
