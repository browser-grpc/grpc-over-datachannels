# Publish the grpc-dc npm package via Trusted Publishing
# (OIDC). Manual dispatch only; see NPM-PUBLISHING.md.
# Requires the Trusted Publisher configured for grpc-dc
# on npmjs.com (this repo + this workflow file).
name: publish-npm
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - working-directory: js
        run: npm publish --provenance --access public
