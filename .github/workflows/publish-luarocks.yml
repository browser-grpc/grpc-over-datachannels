# Publish the grpc-dc and kafka-grpc rocks via LuaRocks
# (luarocks upload). Manual dispatch only. Requires the
# LUAROCKS_API_KEY repo secret (luarocks.org account key).
name: publish-luarocks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - name: JSON library for luarocks upload
        run: luarocks install lua-cjson
      - name: Upload grpc-dc
        working-directory: packages/grpc-lua
        run: |
          # luarocks upload also tries to hand the server a
          # locally packed src.rock and exits 1 when the
          # server builds that rock from the git source
          # itself (repeated dispatch: 'revision already
          # exists'). Judge by registry state instead.
          VER=$(basename grpc-dc-*.rockspec .rockspec | sed 's/^grpc-dc-//')
          luarocks upload --api-key ${{ secrets.LUAROCKS_API_KEY }} grpc-dc-*.rockspec || true
          curl -sf https://luarocks.org/modules/unicomp21/grpc-dc | grep -q "$VER"
      - name: Upload kafka-grpc
        if: "!cancelled()"
        working-directory: packages/kafka-lua
        run: |
          VER=$(basename kafka-grpc-*.rockspec .rockspec | sed 's/^kafka-grpc-//')
          luarocks upload --api-key ${{ secrets.LUAROCKS_API_KEY }} kafka-grpc-*.rockspec || true
          curl -sf https://luarocks.org/modules/unicomp21/kafka-grpc | grep -q "$VER"
      - name: Upload eventbus-grpc
        if: "!cancelled()"
        working-directory: packages/eventbus-lua
        run: |
          VER=$(basename eventbus-grpc-*.rockspec .rockspec | sed 's/^eventbus-grpc-//')
          luarocks upload --api-key ${{ secrets.LUAROCKS_API_KEY }} eventbus-grpc-*.rockspec || true
          curl -sf https://luarocks.org/modules/unicomp21/eventbus-grpc | grep -q "$VER"
