# pip packaging for the generated Python runtime.
# Install from the export root: pip install ./python
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grpc-dc"
version = "0.32.9"
description = "gRPC over WebRTC DataChannels — dependency-free generated Python runtime"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
include = ["grpcdc*"]
