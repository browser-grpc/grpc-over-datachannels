# pip packaging for the generated Python runtime.
# Install from the export root: pip install ./python
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grpc-dc"
version = "0.35.10"
description = "gRPC over WebRTC DataChannels — dependency-free generated Python runtime"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
keywords = ["grpc", "webrtc", "datachannel", "rpc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://browser-grpc.github.io/grpc-over-datachannels"
Repository = "https://github.com/browser-grpc/grpc-over-datachannels"

[tool.setuptools.packages.find]
include = ["grpcdc*"]
