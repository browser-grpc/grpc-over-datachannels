[package]
name = "grpc-dc-wasm-rust"
version = "0.1.0"
edition = "2021"
description = "Native WASM Rust gRPC-over-DataChannels client: the real grpc_dc runtime compiled to wasm32, bridged to an RTCDataChannel by wasm-bindgen (contrast with ../go, whose wasm client facades the JS implementation)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
grpc-dc = { path = "../../rust" }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
futures-util = "0.3"
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = "s"
