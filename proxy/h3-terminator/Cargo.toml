[package]
name = "grpc-dc-h3-terminator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "QUIC (HTTP/3 transport layer) termination spike for grpc-dc-proxy: quinn endpoint bridging streams to a TCP backend"

# Separate from the zero-dependency dc-webrtc crate, like the
# smoltcp sidecar: proxy infrastructure may link mature
# protocol crates (quinn/rustls here).
[dependencies]
quinn = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
rcgen = "0.14"
rustls = "0.23"
rustls-pki-types = "1"
