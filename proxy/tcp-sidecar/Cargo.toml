[package]
name = "grpc-dc-tcp-sidecar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Userspace TCP (smoltcp) sidecar spike for grpc-dc-proxy: TCP termination over a packet transport with zero OS sockets in the proof"

# Deliberately separate from the zero-dependency dc-webrtc crate:
# the WebRTC stack keeps its no-external-deps guarantee; proxy
# infrastructure may link mature protocol crates (smoltcp here).
[dependencies]
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
