[package]
name = "grpc-dc"
version = "0.1.0"
edition = "2021"
description = "gRPC over WebRTC DataChannels — Rust runtime (wire protocol generated by grpc-dc codegen)"
license = "Apache-2.0"
readme = "../README.md"

[lib]
name = "grpc_dc"
path = "src/lib.rs"

[features]
default = []
# Message types generated by prost implement grpc_dc::Message automatically.
prost = ["dep:prost"]
# Run over the reimplemented WebRTC stack (../webrtc/rust, zero-dep).
webrtc = ["dep:dc-webrtc"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-channel = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
dc-webrtc = { path = "../webrtc/rust", optional = true }
prost = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# Native executor: Tokio (multi-thread). Dev/tests also use Tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }

# wasm32: the browser event loop replaces the Tokio executor (see
# grpc_dc::spawn_task); tokio contributes only its sync primitives,
# the subset tokio supports on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
